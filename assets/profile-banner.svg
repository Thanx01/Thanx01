  <text x="64" y="222" fill="#564C42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400">LLM Post-Training <tspan fill="#C2532F">·</tspan> Web Agents <tspan fill="#C2532F">·</tspan> Game AI</text>

