<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">Zhouzheng Xu — LLM Post-Training · Web Agents · Game AI</title>
  <desc id="desc">Profile header for Zhouzheng Xu (Thanx01). The name and research areas are set on the left of a warm ivory card. On the right, a plotted field of branching decision trajectories grows from a single root. One route through the search tree is highlighted in terracotta and ends at a ringed goal point.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9F5EE"/>
      <stop offset="1" stop-color="#F1E9DC"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse" x="4" y="4">
      <circle cx="2" cy="2" r="1.1" fill="#CFC3B1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.9" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fieldMask">
      <rect x="752" y="36" width="412" height="244" fill="url(#fade)"/>
    </mask>
  </defs>

  <!-- Card -->
  <rect x="1" y="1" width="1198" height="308" rx="18" fill="url(#paper)" stroke="#E2D7C5" stroke-width="1.5"/>

